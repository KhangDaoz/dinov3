dataset:
  root: data/CUB_200_2011
  validation_fraction: 0.2
  split_seed: 42
  development_classes: 100
  total_classes: 200
  expected_development_images: 5864
  expected_test_images: 5924

model:
  model_id: facebook/dinov3-vitb16-pretrain-lvd1689m
  revision: 5931719e67bbdb9737e363e781fb0c67687896bc
  embedding_dim: 768
  register_tokens: 4
  expected_patch_tokens: 196

representation:
  method: m3
  name: cls_mean_projection
  source_layer: final
  pooling: projection
  normalization: l2

runtime:
  batch_size: 40
  num_workers: 4
  prefetch_factor: 2
  amp: false
  world_size: 2
  similarity_chunk_size: 1024

evaluation:
  recall_k: [1, 2, 4, 8]
  ranking_depth: 100
  self_match_exclusion: true
  tie_policy: stable_gallery_index
  winner_tolerance: 0.000001
  reference_validation_ids: outputs/e2a_cls/m1/split/validation_image_ids.pt

cache:
  path: outputs/e2a_fusion/m3/seed_42/embeddings/validation.pt
  reuse_candidates: []
  schema_version: 2
  materialize_embeddings: true
  cls_path: outputs/e2a_cls/cache/dinov3_cls.pt
  mean_patch_path: outputs/e2a_mean_patch/cache/dinov3_mean_patch.pt
  cls_manifest: outputs/e2a_cls/m1/embeddings/manifest.json
  mean_patch_manifest: outputs/e2a_mean_patch/m2/embeddings/manifest.json

output:
  root: outputs/e2a_fusion/m3/seed_42
  selection_lock: outputs/e2a_selection/selection_lock.json

training:
  seed: 42
  epochs: 30
  classes_per_batch: 20
  images_per_class: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  proxy_weight_decay: 0.0
  proxy_alpha: 32.0
  proxy_margin: 0.1
  gradient_clip_norm: 5.0
