dataset:
  root: data/CUB_200_2011
  validation_fraction: 0.2
  split_seed: 42
  development_classes: 100
  total_classes: 200
  expected_development_images: 5864
  expected_test_images: 5924

model:
  model_id: facebook/dinov3-vitb16-pretrain-lvd1689m
  revision: 5931719e67bbdb9737e363e781fb0c67687896bc
  embedding_dim: 768
  register_tokens: 4
  expected_patch_tokens: 196

representation:
  method: m2
  name: mean_patch
  source_layer: final
  pooling: mean
  normalization: l2

runtime:
  batch_size: 128
  num_workers: 4
  prefetch_factor: 2
  amp: true
  world_size: 2
  similarity_chunk_size: 1024

evaluation:
  recall_k: [1, 2, 4, 8]
  ranking_depth: 100
  self_match_exclusion: true
  tie_policy: stable_gallery_index
  winner_tolerance: 0.000001
  reference_validation_ids: outputs/e2a_cls/m1/split/validation_image_ids.pt

cache:
  path: outputs/e2a_mean_patch/cache/dinov3_mean_patch.pt
  reuse_candidates: []
  schema_version: 2
  materialize_embeddings: false
  reference_manifest: outputs/e2a_cls/m1/embeddings/manifest.json

output:
  root: outputs/e2a_mean_patch/m2
  selection_lock: outputs/e2a_selection/selection_lock.json
