dataset:
  root: data/CUB_200_2011
inputs:
  cache: outputs/e2a_cls/cache/dinov3_cls.pt
  manifest: outputs/e2a_selection/artifacts/m1/embeddings/manifest.json
  selection: outputs/e2a_selection/test_selection.json
  validation_ids: outputs/e2a_cls/m1/split/validation_image_ids.pt
training:
  seed: 42
  epochs: 30
  global_batch_size: 4096
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 5.0
runtime:
  world_size: 2
  device: cuda
  pair_chunk_size: 4096
  query_chunk_size: 128
controls:
  enabled: true
  source: controlled_retrain
  e1_root: outputs/e1_evidential/seed_42
  e1_cache: outputs/e1_evidential/cache/dinov3_cls.pt
evaluation:
  ranking_depth: 100
  lambdas: [0.0, 0.25, 0.5, 0.75, 0.9, 1.0]
  uncertainty_top_n: [10, 20, 50, 100]
  bootstrap_samples: 2000
output_root: outputs/e2b_pair_confidence/seed_42
