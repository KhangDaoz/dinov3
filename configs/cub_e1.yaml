dataset:
  root: data/CUB_200_2011
  validation_fraction: 0.2
  development_classes: 100
  total_classes: 200
  expected_development_images: 5864
  expected_test_images: 5924

model:
  model_id: facebook/dinov3-vitb16-pretrain-lvd1689m
  revision: main
  embedding_dim: 768
  register_tokens: 4
  evidence_activation: softplus
  head: linear
  hidden_dim: 512

training:
  seed: 42
  seeds: [42, 43, 44]
  epochs: 30
  annealing_epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 256
  num_workers: 4
  prefetch_factor: 2
  amp: true
  deterministic: false

retrieval:
  recall_k: [1, 2, 4, 8]
  similarity_chunk_size: 1024
  top_n_grid: [10, 20, 50, 100]
  beta_grid: [0.1, 0.25, 0.5, 0.75]
  bootstrap_samples: 2000
  self_match_exclusion: true

output:
  root: outputs/e1_evidential
  feature_cache: outputs/e1_evidential/cache/dinov3_cls.pt
  schema_version: 1
