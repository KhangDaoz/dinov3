[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertainty-retrieval"
version = "0.1.0"
description = "Uncertainty-aware DINOv3 retrieval on CUB-200-2011"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "Pillow>=11.0",
    "PyYAML>=6.0",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.56",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: tests that exercise multiple repository components",
]

